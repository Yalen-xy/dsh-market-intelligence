name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build Claude MCPB
        run: npm run build:claude

      - name: Typecheck Claude adapter
        run: npm run typecheck:claude

      - name: Test
        run: npm test

      - name: Validate Claude MCPB package and adapter
        run: npm run test:claude

      - name: Smoke-test Claude MCPB over MCP stdio
        run: npm run test:claude:smoke

      - name: Run profile smoke test
        run: npm run test:load-profile

      - name: Test installer with Windows PowerShell 5.1
        run: npm run test:installer:windows-powershell

      - name: Test installer with PowerShell 7
        run: npm run test:installer:pwsh

      - name: Inspect, create, and stage verified assets
        shell: pwsh
        run: |
          npm pack --dry-run --ignore-scripts
          $pack = npm pack --ignore-scripts --json | Out-String | ConvertFrom-Json
          if (@($pack).Count -ne 1 -or [string]::IsNullOrWhiteSpace($pack[0].filename)) {
            throw 'npm pack did not produce exactly one package'
          }
          $packageFile = $pack[0].filename
          node scripts/stage-release.mjs --tag $env:GITHUB_REF_NAME --package $packageFile --claude .artifacts\claude-market-intelligence-latest.mcpb --output .release

      - name: Write fixed Release notes
        shell: pwsh
        run: |
          $notes = @"
          # dsh-market-intelligence $env:GITHUB_REF_NAME

          ## Requirements

          Windows with either DeepSeek Harness configured through a valid managed desktop profile, which requires Node.js ^22.19.0 or >=24.0.0, or Claude Desktop. Claude Desktop supplies the extension runtime; normal Claude installation needs no dependency management. The DSH installer requires Windows PowerShell 5.1 or PowerShell 7.

          ## Material changes

          This release contains separate DSH and Claude installation assets under the same license and disclaimer: the compiled DeepSeek Harness market-information plugin with its integrity-checked Windows lifecycle scripts, and the one-click Claude MCPB extension.

          ## Known provider limitations and disclaimer

          Tencent and Sina are not partners of, and have not authorized, this project. Upstream endpoints may change or become unavailable without notice. Each user is responsible for complying with applicable law and upstream terms. This plugin is for personal, non-commercial, read-only research and is not investment advice. These notices do not create upstream authorization or eliminate legal risk.
          "@
          $notes | Set-Content -LiteralPath .release-notes.md -Encoding utf8

      - name: Publish GitHub Release
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') {
            throw 'release tag must be an exact stable semantic version'
          }
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $expectedAssets = @(
            ".release\dsh-market-intelligence-${version}.tgz"
            '.release\dsh-market-intelligence-latest.zip'
            '.release\claude-market-intelligence-latest.mcpb'
            '.release\install.ps1'
            '.release\uninstall.ps1'
            '.release\SHA256SUMS.txt'
            '.release\LICENSE.txt'
          )
          $releaseEntries = @(Get-ChildItem -LiteralPath .release -Force)
          if ($releaseEntries.Count -ne 7 -or @($releaseEntries | Where-Object { $_.PSIsContainer }).Count -ne 0) {
            throw 'staged release must contain exactly seven files'
          }
          foreach ($asset in $expectedAssets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw 'staged release is missing an expected asset'
            }
          }
          gh release create $env:GITHUB_REF_NAME `
            .release\dsh-market-intelligence-${version}.tgz `
            .release\dsh-market-intelligence-latest.zip `
            .release\claude-market-intelligence-latest.mcpb `
            .release\install.ps1 `
            .release\uninstall.ps1 `
            .release\SHA256SUMS.txt `
            .release\LICENSE.txt `
            --verify-tag --title $env:GITHUB_REF_NAME --notes-file .release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
