name: Release bootstrap v0.1.0

'on':
  push:
    branches:
      - release-bootstrap-v0.1.0

permissions:
  contents: write

concurrency:
  group: release-bootstrap-v0.1.0-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.0
  RELEASE_VERSION: 0.1.0
  RELEASE_TARGET_SHA: 354c925ae3be6c681f06cb0d40de6b92e2d22783
  RELEASE_TARGET_TREE_SHA: c7efff10c3f730bec62127f6dab127b62c1f8f26

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Fail closed when v0.1.0 already has a tag or Release
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }

          function Assert-GitHubResourceAbsent {
            param(
              [Parameter(Mandatory)] [string] $Uri,
              [Parameter(Mandatory)] [string] $Label
            )

            $response = Invoke-WebRequest -Uri $Uri -Headers $headers -SkipHttpErrorCheck -ErrorAction Stop
            if ($response.StatusCode -eq 404) {
              return
            }
            if ($response.StatusCode -ge 200 -and $response.StatusCode -lt 300) {
              throw "$Label already exists; refusing to bootstrap a duplicate release"
            }
            throw "could not prove $Label is absent (HTTP $($response.StatusCode)); failing closed"
          }

          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $repositoryResponse = Invoke-WebRequest -Uri $apiRoot -Headers $headers -SkipHttpErrorCheck -ErrorAction Stop
          if ($repositoryResponse.StatusCode -ne 200) {
            throw "could not authenticate and read $env:GITHUB_REPOSITORY (HTTP $($repositoryResponse.StatusCode)); failing closed"
          }
          $repository = $repositoryResponse.Content | ConvertFrom-Json
          if ($repository.full_name -cne $env:GITHUB_REPOSITORY) {
            throw "authenticated repository identity does not exactly match $env:GITHUB_REPOSITORY; failing closed"
          }
          $commitResponse = Invoke-WebRequest -Uri "$apiRoot/git/commits/$env:RELEASE_TARGET_SHA" -Headers $headers -SkipHttpErrorCheck -ErrorAction Stop
          if ($commitResponse.StatusCode -ne 200) {
            throw "could not authenticate and read fixed Git commit $env:RELEASE_TARGET_SHA (HTTP $($commitResponse.StatusCode)); failing closed"
          }
          $commit = $commitResponse.Content | ConvertFrom-Json
          if ($commit.sha -cne $env:RELEASE_TARGET_SHA -or $commit.tree.sha -cne $env:RELEASE_TARGET_TREE_SHA) {
            throw 'authenticated fixed Git commit does not exactly match the configured commit/tree; failing closed'
          }
          Assert-GitHubResourceAbsent -Uri "$apiRoot/releases/tags/$env:RELEASE_TAG" -Label "GitHub Release $env:RELEASE_TAG"
          Assert-GitHubResourceAbsent -Uri "$apiRoot/git/ref/tags/$env:RELEASE_TAG" -Label "Git tag $env:RELEASE_TAG"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check out fixed release target without credentials
        uses: actions/checkout@v4
        with:
          ref: 354c925ae3be6c681f06cb0d40de6b92e2d22783
          fetch-depth: 1
          persist-credentials: false

      - name: Verify checked-out release commit and tree
        shell: pwsh
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          $actualTreeSha = (git rev-parse 'HEAD^{tree}').Trim()
          if ($actualSha -cne $env:RELEASE_TARGET_SHA) {
            throw "checked-out SHA does not match fixed release target: $actualSha"
          }
          if ($actualTreeSha -cne $env:RELEASE_TARGET_TREE_SHA) {
            throw "checked-out tree does not match fixed release target tree: $actualTreeSha"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Run profile smoke test
        run: npm run test:load-profile

      - name: Test installer with Windows PowerShell 5.1
        run: npm run test:installer:windows-powershell

      - name: Test installer with PowerShell 7
        run: npm run test:installer:pwsh

      - name: Inspect, create, and stage verified assets
        shell: pwsh
        run: |
          npm pack --dry-run --ignore-scripts
          $pack = npm pack --ignore-scripts --json | Out-String | ConvertFrom-Json
          if (@($pack).Count -ne 1 -or [string]::IsNullOrWhiteSpace($pack[0].filename)) {
            throw 'npm pack did not produce exactly one package'
          }
          $packageFile = $pack[0].filename
          node scripts/stage-release.mjs --tag $env:RELEASE_TAG --package $packageFile --output .release

      - name: Atomically reserve v0.1.0 at the verified commit
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $body = @{ ref = "refs/tags/$env:RELEASE_TAG"; sha = $env:RELEASE_TARGET_SHA } | ConvertTo-Json -Compress
          $response = Invoke-WebRequest -Method Post -Uri "$apiRoot/git/refs" -Headers $headers -ContentType 'application/json' -Body $body -SkipHttpErrorCheck -ErrorAction Stop
          if ($response.StatusCode -ne 201) {
            throw "Git Data API did not atomically create refs/tags/$env:RELEASE_TAG (HTTP $($response.StatusCode)); aborting"
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify reserved tag still targets the fixed commit
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $response = Invoke-WebRequest -Uri "$apiRoot/git/ref/tags/$env:RELEASE_TAG" -Headers $headers -SkipHttpErrorCheck -ErrorAction Stop
          if ($response.StatusCode -ne 200) {
            throw "could not read the newly reserved tag (HTTP $($response.StatusCode)); aborting"
          }
          $tag = $response.Content | ConvertFrom-Json
          if ($tag.ref -cne "refs/tags/$env:RELEASE_TAG" -or $tag.object.type -cne 'commit' -or $tag.object.sha -cne $env:RELEASE_TARGET_SHA) {
            throw 'reserved tag does not exactly target the fixed release commit; aborting'
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Write fixed Release notes
        shell: pwsh
        run: |
          $notes = @"
          # dsh-market-intelligence $env:RELEASE_TAG

          ## Requirements

          Windows DSH Desktop with a valid managed desktop profile, Node.js ^22.19.0 or >=24.0.0, and Windows PowerShell 5.1 or PowerShell 7.

          ## Material changes

          This release contains the compiled DSH market-information plugin and its integrity-checked Windows install, upgrade, rollback, and uninstall scripts.

          ## Known provider limitations and disclaimer

          Tencent and Sina are not partners of, and have not authorized, this project. Upstream endpoints may change or become unavailable without notice. Each user is responsible for complying with applicable law and upstream terms. This plugin is for personal, non-commercial, read-only research and is not investment advice. These notices do not create upstream authorization or eliminate legal risk.
          "@
          $notes | Set-Content -LiteralPath .release-notes.md -Encoding utf8

      - name: Create a draft Release with exactly five staged assets
        shell: pwsh
        run: |
          $expectedAssets = @(
            ".release\dsh-market-intelligence-$env:RELEASE_VERSION.tgz"
            '.release\install.ps1'
            '.release\uninstall.ps1'
            '.release\SHA256SUMS.txt'
            '.release\LICENSE.txt'
          )
          $releaseEntries = @(Get-ChildItem -LiteralPath .release -Force)
          if ($releaseEntries.Count -ne 5 -or @($releaseEntries | Where-Object { $_.PSIsContainer }).Count -ne 0) {
            throw 'staged release must contain exactly five files'
          }
          foreach ($asset in $expectedAssets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw 'staged release is missing an expected asset'
            }
          }
          gh release create $env:RELEASE_TAG `
            ".release\dsh-market-intelligence-$env:RELEASE_VERSION.tgz" `
            .release\install.ps1 `
            .release\uninstall.ps1 `
            .release\SHA256SUMS.txt `
            .release\LICENSE.txt `
            --verify-tag --draft --title $env:RELEASE_TAG --notes-file .release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify draft Release tag and exact asset set
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $response = Invoke-WebRequest -Uri "$apiRoot/releases/tags/$env:RELEASE_TAG" -Headers $headers -SkipHttpErrorCheck -ErrorAction Stop
          if ($response.StatusCode -ne 200) {
            throw "could not read the draft Release (HTTP $($response.StatusCode)); leaving the tag and any draft untouched for recovery"
          }
          $release = $response.Content | ConvertFrom-Json
          $tagResponse = Invoke-WebRequest -Uri "$apiRoot/git/ref/tags/$env:RELEASE_TAG" -Headers $headers -SkipHttpErrorCheck -ErrorAction Stop
          if ($tagResponse.StatusCode -ne 200) {
            throw "could not re-read the reserved tag (HTTP $($tagResponse.StatusCode)); leaving the tag and any draft untouched for recovery"
          }
          $tag = $tagResponse.Content | ConvertFrom-Json
          $expectedNames = @(
            "dsh-market-intelligence-$env:RELEASE_VERSION.tgz"
            'install.ps1'
            'uninstall.ps1'
            'SHA256SUMS.txt'
            'LICENSE.txt'
          ) | Sort-Object
          $actualNames = @($release.assets | ForEach-Object { $_.name } | Sort-Object)
          if ($release.tag_name -cne $env:RELEASE_TAG -or -not $release.draft -or $release.prerelease -or $tag.ref -cne "refs/tags/$env:RELEASE_TAG" -or $tag.object.type -cne 'commit' -or $tag.object.sha -cne $env:RELEASE_TARGET_SHA -or $actualNames.Count -ne 5 -or (Compare-Object $expectedNames $actualNames -CaseSensitive).Count -ne 0) {
            throw 'draft Release target, tag, or assets are not exactly the verified values; leaving the tag and draft untouched for recovery'
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish verified draft Release
        shell: pwsh
        run: gh release edit $env:RELEASE_TAG --draft=false
        env:
          GH_TOKEN: ${{ github.token }}

