name: Recover verified draft Release v0.1.0

'on':
  push:
    branches:
      - release-bootstrap-v0.1.0

permissions:
  contents: write

concurrency:
  group: release-bootstrap-v0.1.0-${{ github.repository }}
  cancel-in-progress: false

env:
  RELEASE_TAG: v0.1.0
  RELEASE_VERSION: 0.1.0
  RELEASE_ID: '379294023'
  RELEASE_TARGET_SHA: 354c925ae3be6c681f06cb0d40de6b92e2d22783
  RELEASE_TARGET_TREE_SHA: c7efff10c3f730bec62127f6dab127b62c1f8f26
  RELEASE_ENUMERATION_MAX_PAGES: 10

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Verify and publish the existing v0.1.0 draft
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = 'Stop'

          function Invoke-ApiGet {
            param(
              [Parameter(Mandatory)] [string] $Uri,
              [Parameter(Mandatory)] [string] $Label,
              [switch] $ExpectArray
            )

            $fixedApiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
            if ($Uri -cne $fixedApiRoot -and -not $Uri.StartsWith("$fixedApiRoot/", [System.StringComparison]::Ordinal)) {
              throw 'API GET URI is outside the fixed repository API root; failing closed'
            }
            $headers = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $env:GH_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $response = Invoke-WebRequest -Method Get -Uri $Uri -Headers $headers -SkipHttpErrorCheck -ErrorAction Stop
            if ($response.StatusCode -ne 200) {
              throw "could not prove $Label (HTTP $($response.StatusCode)); failing closed"
            }
            if ([string]::IsNullOrWhiteSpace([string]$response.Content)) {
              throw "$Label returned an empty response; failing closed"
            }
            if ($ExpectArray -and -not $response.Content.TrimStart().StartsWith('[', [System.StringComparison]::Ordinal)) {
              throw "$Label did not return a JSON array; failing closed"
            }
            try {
              return ($response.Content | ConvertFrom-Json -Depth 100)
            } catch {
              throw "$Label returned invalid JSON; failing closed"
            }
          }

          function Assert-ReleaseContract {
            param(
              [Parameter(Mandatory)] [object] $Release,
              [Parameter(Mandatory)] [bool] $ExpectedDraft,
              [Parameter(Mandatory)] [object] $Repository
            )

            $requiredReleaseFields = @('tag_name', 'draft', 'prerelease', 'target_commitish', 'id', 'node_id', 'html_url', 'assets')
            foreach ($field in $requiredReleaseFields) {
              if (-not ($Release.PSObject.Properties.Name -ccontains $field) -or $null -eq $Release.$field) {
                throw "Release is missing required field '$field'; failing closed"
              }
            }
            if ([string]::IsNullOrWhiteSpace([string]$Release.tag_name) -or $Release.tag_name -cne $env:RELEASE_TAG) {
              throw 'Release tag_name is not the exact recovery tag; failing closed'
            }
            if ($Release.draft -isnot [bool] -or $Release.prerelease -isnot [bool]) {
              throw 'Release draft/prerelease fields are not booleans; failing closed'
            }
            if ([bool]$Release.draft -ne $ExpectedDraft) {
              throw 'Release draft state is not the required state; failing closed'
            }
            if ([bool]$Release.prerelease) {
              throw 'Release is unexpectedly a prerelease; failing closed'
            }

            if ([string]::IsNullOrWhiteSpace([string]$Release.target_commitish)) {
              throw 'Release target_commitish is empty; failing closed'
            }
            $allowedTargetCommitish = @(
              $env:RELEASE_TARGET_SHA
              $env:RELEASE_TAG
              "refs/tags/$env:RELEASE_TAG"
              [string]$Repository.default_branch
              "refs/heads/$($Repository.default_branch)"
            )
            if (-not ($allowedTargetCommitish -ccontains [string]$Release.target_commitish)) {
              throw 'Release target_commitish conflicts with the fixed tag association; failing closed'
            }

            try {
              $releaseId = [long]$Release.id
            } catch {
              throw 'Release id is not an integer; failing closed'
            }
            if ($releaseId -le 0) {
              throw 'Release id is empty or invalid; failing closed'
            }
            if ($releaseId -ne [long]$env:RELEASE_ID) {
              throw 'Release id does not match the fixed recovery Release; failing closed'
            }
            if ([string]::IsNullOrWhiteSpace([string]$Release.node_id)) {
              throw 'Release node_id is empty; failing closed'
            }
            if ([string]::IsNullOrWhiteSpace([string]$Release.html_url)) {
              throw 'Release html_url is empty; failing closed'
            }
            try {
              $releaseHtmlUri = [uri][string]$Release.html_url
            } catch {
              throw 'Release html_url is invalid; failing closed'
            }
            $expectedHtmlPrefix = "https://github.com/$env:GITHUB_REPOSITORY/releases/tag/"
            if ($releaseHtmlUri.Scheme -cne 'https' -or
                $releaseHtmlUri.Host -cne 'github.com' -or
                -not $releaseHtmlUri.AbsoluteUri.StartsWith($expectedHtmlPrefix, [System.StringComparison]::Ordinal)) {
              throw 'Release html_url does not belong to the authenticated repository; failing closed'
            }

            $expectedNames = @(
              "dsh-market-intelligence-$env:RELEASE_VERSION.tgz"
              'install.ps1'
              'uninstall.ps1'
              'SHA256SUMS.txt'
              'LICENSE.txt'
            ) | Sort-Object -CaseSensitive
            $assets = @($Release.assets)
            if ($assets.Count -ne 5) {
              throw 'Release does not contain exactly five assets; failing closed'
            }
            foreach ($asset in $assets) {
              $requiredAssetFields = @('name', 'size')
              foreach ($field in $requiredAssetFields) {
                if (-not ($asset.PSObject.Properties.Name -ccontains $field) -or $null -eq $asset.$field) {
                  throw "Release asset is missing required field '$field'; failing closed"
                }
              }
              if ([string]::IsNullOrWhiteSpace([string]$asset.name)) {
                throw 'Release contains an asset with an empty name; failing closed'
              }
              try {
                $assetSize = [long]$asset.size
              } catch {
                throw 'Release contains an asset with a non-integer size; failing closed'
              }
              if ($assetSize -le 0) {
                throw 'Release contains an empty asset; failing closed'
              }
            }
            $duplicateNames = @($assets | Group-Object -Property name -CaseSensitive | Where-Object { $_.Count -ne 1 })
            if ($duplicateNames.Count -ne 0) {
              throw 'Release contains duplicate asset names; failing closed'
            }
            $actualNames = @($assets | ForEach-Object { [string]$_.name } | Sort-Object -CaseSensitive)
            if ((Compare-Object $expectedNames $actualNames -CaseSensitive).Count -ne 0) {
              throw 'Release asset names differ from the exact five-file allowlist; failing closed'
            }
          }

          $apiRoot = "https://api.github.com/repos/$env:GITHUB_REPOSITORY"
          $repository = Invoke-ApiGet -Uri $apiRoot -Label 'repository identity'
          if ($repository.full_name -cne $env:GITHUB_REPOSITORY) {
            throw 'authenticated repository identity does not exactly match GITHUB_REPOSITORY; failing closed'
          }
          if ([string]::IsNullOrWhiteSpace([string]$repository.default_branch)) {
            throw 'authenticated repository default branch is empty; failing closed'
          }

          $commit = Invoke-ApiGet -Uri "$apiRoot/git/commits/$env:RELEASE_TARGET_SHA" -Label 'fixed Git commit'
          if ($commit.sha -cne $env:RELEASE_TARGET_SHA -or $commit.tree.sha -cne $env:RELEASE_TARGET_TREE_SHA) {
            throw 'fixed Git commit/tree does not exactly match the recovery target; failing closed'
          }

          $tag = Invoke-ApiGet -Uri "$apiRoot/git/ref/tags/$env:RELEASE_TAG" -Label 'existing lightweight tag'
          if ($tag.ref -cne "refs/tags/$env:RELEASE_TAG" -or $tag.object.type -cne 'commit' -or $tag.object.sha -cne $env:RELEASE_TARGET_SHA) {
            throw 'existing tag is not the exact lightweight tag at the fixed commit; failing closed'
          }

          $allReleases = [System.Collections.Generic.List[object]]::new()
          $enumerationComplete = $false
          for ($page = 1; $page -le [int]$env:RELEASE_ENUMERATION_MAX_PAGES; $page++) {
            $pageItems = @(Invoke-ApiGet -Uri "$apiRoot/releases?per_page=100&page=$page" -Label "release enumeration page $page" -ExpectArray)
            foreach ($item in $pageItems) {
              if ($null -eq $item) {
                throw 'release enumeration returned a null item; failing closed'
              }
              $allReleases.Add($item)
            }
            if ($pageItems.Count -lt 100) {
              $enumerationComplete = $true
              break
            }
          }
          if (-not $enumerationComplete) {
            throw 'release enumeration exceeded the fixed ten-page bound; failing closed'
          }

          $tagMatches = @($allReleases | Where-Object { $_.tag_name -ceq $env:RELEASE_TAG })
          if ($tagMatches.Count -ne 1 -or -not [bool]$tagMatches[0].draft -or [long]$tagMatches[0].id -ne [long]$env:RELEASE_ID) {
            throw 'did not find exactly the fixed draft and no conflicting Release for v0.1.0; failing closed'
          }
          $draft = $tagMatches[0]
          Assert-ReleaseContract -Release $draft -ExpectedDraft $true -Repository $repository

          $draftReread = Invoke-ApiGet -Uri "$apiRoot/releases/$env:RELEASE_ID" -Label 'fixed draft re-read by id'
          Assert-ReleaseContract -Release $draftReread -ExpectedDraft $true -Repository $repository
          if ([long]$draftReread.id -ne [long]$env:RELEASE_ID -or
              $draftReread.node_id -cne $draft.node_id -or $draftReread.html_url -cne $draft.html_url) {
            throw 'draft identity changed between enumeration and id re-read; failing closed'
          }

          $prePublishTag = Invoke-ApiGet -Uri "$apiRoot/git/ref/tags/$env:RELEASE_TAG" -Label 'pre-publication lightweight tag'
          if ($prePublishTag.ref -cne "refs/tags/$env:RELEASE_TAG" -or $prePublishTag.object.type -cne 'commit' -or $prePublishTag.object.sha -cne $env:RELEASE_TARGET_SHA) {
            throw 'tag changed before publication; failing closed'
          }

          gh release edit v0.1.0 --draft=false
          $publishExitCode = $LASTEXITCODE
          if ($publishExitCode -ne 0) {
            throw "gh release edit failed with exit code $publishExitCode; failing closed"
          }

          $published = Invoke-ApiGet -Uri "$apiRoot/releases/tags/$env:RELEASE_TAG" -Label 'published Release by tag'
          Assert-ReleaseContract -Release $published -ExpectedDraft $false -Repository $repository
          if ([long]$published.id -ne [long]$env:RELEASE_ID -or $published.node_id -cne $draft.node_id) {
            throw 'public by-tag endpoint returned a different Release identity; failing closed'
          }

          $finalTag = Invoke-ApiGet -Uri "$apiRoot/git/ref/tags/$env:RELEASE_TAG" -Label 'final lightweight tag'
          if ($finalTag.ref -cne "refs/tags/$env:RELEASE_TAG" -or $finalTag.object.type -cne 'commit' -or $finalTag.object.sha -cne $env:RELEASE_TARGET_SHA) {
            throw 'tag changed during publication; failing closed'
          }
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

